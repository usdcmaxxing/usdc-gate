services:
  - type: web
    name: usdc-gate
    runtime: node
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    envVars:
      - key: SELLER_PRIVATE_KEY
        sync: false
      - key: PUBLIC_ORIGIN
        value: https://usdc-gate.onrender.com
      - key: PORT
        value: 4021
    healthCheckPath: /health
